name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIFE_FRAMEWORK_REPO || 'suite-life' }}
          path: Life
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./../Life/packages/shared ./../Life/packages/backend-core ./../Life/packages/learn-core
          python -m pip install -r backend/requirements.txt pytest httpx
      - name: Test backend
        working-directory: repo/backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIFE_FRAMEWORK_REPO || 'suite-life' }}
          path: Life
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: repo/frontend/package-lock.json
      - name: Install dependencies
        working-directory: repo/frontend
        run: npm ci
      - name: Test frontend
        working-directory: repo/frontend
        run: npm test -- --pool=forks --poolOptions.forks.maxForks=2 --poolOptions.forks.minForks=1
      - name: Build frontend
        working-directory: repo/frontend
        run: npm run build
